apiVersion: v1
kind: ConfigMap
metadata:
  name: unifiaap-config
  namespace: unifiappay
  labels:
    app: unifiaap-pay
data:
  API_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  PORT: "5000"
  
  # Database (RDS) - será injetado via Secret
  DB_PORT: "5432"
  DB_NAME: "pixdb"
  
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  
  BACEN_COMPLIANCE: "enabled"
  AUDIT_ENABLED: "true"
  
  REQUEST_TIMEOUT: "60"
  CONNECTION_TIMEOUT: "30"