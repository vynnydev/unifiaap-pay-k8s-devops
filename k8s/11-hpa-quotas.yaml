---
# ResourceQuota
apiVersion: v1
kind: ResourceQuota
metadata:
  name: unifiaap-resource-quota
  namespace: unifiappay
  labels:
    app: unifiaap-pay
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    persistentvolumeclaims: "10"
    services: "10"
    secrets: "20"
    configmaps: "20"
    pods: "50"

---
# LimitRange
apiVersion: v1
kind: LimitRange
metadata:
  name: unifiaap-limit-range
  namespace: unifiappay
  labels:
    app: unifiaap-pay
spec:
  limits:
  - max:
      cpu: "1"
      memory: 1Gi
    min:
      cpu: "50m"
      memory: 32Mi
    default:
      cpu: "200m"
      memory: 256Mi
    defaultRequest:
      cpu: "100m"
      memory: 128Mi
    type: Container
  - max:
      storage: 50Gi
    min:
      storage: 1Gi
    type: PersistentVolumeClaim

---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: unifiaap-api-pdb
  namespace: unifiappay
  labels:
    app: unifiaap-pay
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: unifiaap-api