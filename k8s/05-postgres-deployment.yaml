apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifiaap-api-deployment
  namespace: unifiappay
  labels:
    app: unifiaap-api
    tier: backend
spec:
  replicas: 1  # Começar com 1 réplica
  selector:
    matchLabels:
      app: unifiaap-api
  template:
    metadata:
      labels:
        app: unifiaap-api
        tier: backend
    spec:
      containers:
      - name: unifiaap-api
        image: unifiaap-pay:latest
        imagePullPolicy: Never
        
        ports:
        - containerPort: 5000
          name: http
        
        env:
        - name: PORT
          value: "5000"
        - name: API_VERSION
          value: "1.0.0"
        - name: ENVIRONMENT
          value: "production"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: unifiaap-secrets
              key: DB_HOST
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "pixdb"
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: unifiaap-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unifiaap-secrets
              key: DB_PASSWORD
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 5

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: unifiaap-api-service
  namespace: unifiappay
  labels:
    app: unifiaap-api
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
  selector:
    app: unifiaap-api