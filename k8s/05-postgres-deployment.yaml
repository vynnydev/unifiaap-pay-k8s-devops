apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifiaap-api-deployment
  namespace: unifiappay
  labels:
    app: unifiaap-api
    tier: backend
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: unifiaap-api
  template:
    metadata:
      labels:
        app: unifiaap-api
        tier: backend
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
    spec:
      serviceAccountName: unifiaap-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      
      containers:
      - name: unifiaap-api
        image: ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/unifiaap-pay-dev-api:latest
        imagePullPolicy: Always
        
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        
        env:
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: unifiaap-config
              key: PORT
        - name: API_VERSION
          valueFrom:
            configMapKeyRef:
              name: unifiaap-config
              key: API_VERSION
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: unifiaap-config
              key: ENVIRONMENT
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: unifiaap-secrets
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: unifiaap-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: unifiaap-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: unifiaap-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unifiaap-secrets
              key: DB_PASSWORD
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        volumeMounts:
        - name: api-logs
          mountPath: /app/logs
        
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
      
      volumes:
      - name: api-logs
        persistentVolumeClaim:
          claimName: api-logs-pvc

---
# Service LoadBalancer (AWS ALB)
apiVersion: v1
kind: Service
metadata:
  name: unifiaap-api-service
  namespace: unifiappay
  labels:
    app: unifiaap-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  selector:
    app: unifiaap-api