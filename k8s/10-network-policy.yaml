---
# NetworkPolicy - Default Deny
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifiaap-default-deny
  namespace: unifiappay
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress

---
# NetworkPolicy - API Ingress
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: unifiaap-api-ingress
  namespace: unifiappay
spec:
  podSelector:
    matchLabels:
      app: unifiaap-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443

---
# NetworkPolicy - Audit Jobs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-job-policy
  namespace: unifiappay
spec:
  podSelector:
    matchLabels:
      app: unifiaap-audit
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: unifiaap-api
    ports:
    - protocol: TCP
      port: 5000
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53

---
# NetworkPolicy - DaemonSet Monitor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: monitor-network-policy
  namespace: unifiappay
spec:
  podSelector:
    matchLabels:
      app: unifiaap-monitor
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: unifiaap-api
    ports:
    - protocol: TCP
      port: 5000
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53